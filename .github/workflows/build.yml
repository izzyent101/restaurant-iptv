name: Build APK

# Builds a signed release APK (+ debug), uploads them as artifacts, and
# publishes the signed release APK as a GitHub Release so the in-app updater
# can pull it. The release tag is the run number = the app's versionCode.
#
# Signing uses repository SECRETS (nothing sensitive is committed):
#   KEYSTORE_BASE64   - base64 of the .jks keystore
#   KEYSTORE_PASSWORD - keystore store password
#   KEY_ALIAS         - key alias
#   KEY_PASSWORD      - key password
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test dashboard and private office gateway
        run: |
          node gateway/package.cjs
          node --test tests/dashboard.test.cjs gateway/server.test.cjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/marhaba.jks"

      - name: Build debug + signed release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/marhaba.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease :app:testReleaseUnitTest :app:lintRelease :launcher:testReleaseUnitTest --stacktrace

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MMG-IPTV-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish Release (for in-app auto-update)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MMG IPTV v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

  gateway-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Windows installer syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE\gateway\setup.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw 'Windows installer has syntax errors'
          }
      - name: Test packaged office gateway on Windows
        run: |
          node gateway/package.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/dashboard.test.cjs gateway/server.test.cjs
