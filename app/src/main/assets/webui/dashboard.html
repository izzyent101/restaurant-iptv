<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant IPTV — Control Center</title>
<link rel="stylesheet" href="/style.css" />
<style>
  .tvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .addbar, .bulkbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .addbar input { flex: 1; min-width: 160px; }
  .selwrap { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; }
  .tvcard .controls { margin-top: 10px; }
  .tvchannelbox, .tvconfigbox { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  .tvchannellist { display: grid; gap: 5px; max-height: 260px; overflow: auto; margin-top: 8px; }
  .dash-link { color: var(--accent); text-decoration: none; font-weight: 600; }
  .offline { opacity: .55; }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/logo.png" class="brand-logo" alt="Marhaba" /> Marhaba IPTV — Control Center</div>
  <a class="dash-link" href="/">This TV →</a>
</header>

<main>
  <section class="card">
    <h2>Bulk control</h2>
    <div class="bulkbar">
      <input id="bulkChannel" class="search" placeholder="Channel name (e.g. ESPN)" />
      <button id="bulkPlaySel" class="btn">Play on selected</button>
      <button id="bulkPlayAll" class="btn primary">Play on all</button>
      <button id="bulkStop" class="btn">Stop all</button>
      <button id="bulkReconnect" class="btn">Reconnect all</button>
    </div>
    <div class="muted small" id="bulkMsg">Matches the channel by name on each TV's own provider. Tick a TV to include it in "selected".</div>
  </section>

  <section class="card">
    <h2>Add a TV</h2>
    <form id="addTvForm" class="addbar">
      <input name="name" placeholder="Name (e.g. Bar TV)" />
      <input name="address" placeholder="Tailscale IP or host:port (e.g. 100.101.102.103:8080)" required />
      <button class="btn primary" type="submit">Add TV</button>
    </form>
    <div class="muted small">Add each TV by its Tailscale IP (or LAN IP). Port defaults to 8080.</div>
  </section>

  <div id="tvGrid" class="tvgrid"></div>
  <p class="muted small" id="emptyHint" style="display:none">No TVs yet. Add each TV above by its address.</p>
</main>

<script src="/dashboard.js"></script>
</body>
</html>
