<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#0e1116" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MMG TV" />
<meta name="robots" content="noindex,nofollow" />
<title>MMG TV</title>
<style>
  :root { --bg:#0e1116; --card:#161b22; --line:#232a33; --text:#e6edf3; --muted:#8b98a5; --accent:#2e7dff; }
  * { box-sizing: border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .box {
    width:100%; max-width:360px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:26px 24px;
    text-align:center;
  }
  .title { font-weight:700; font-size:20px; letter-spacing:.02em; }
  .sub { color:var(--muted); font-size:13px; margin:6px 0 20px; }
  input {
    width:100%; background:#0d1117; color:var(--text); border:1px solid var(--line);
    border-radius:9px; padding:12px 14px; font-size:16px; text-align:center;
  }
  button {
    width:100%; margin-top:12px; background:var(--accent); color:#fff; border:none;
    border-radius:9px; padding:12px 14px; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:disabled { opacity:.6; cursor:default; }
  .msg { min-height:18px; margin-top:12px; font-size:13px; color:#ff8b84; }
</style>
</head>
<body>
  <form class="box" id="f" autocomplete="off">
    <div class="title">MMG&nbsp;TV</div>
    <div class="sub">Enter the control password to continue.</div>
    <input id="pw" type="password" placeholder="Password" autofocus autocomplete="current-password" />
    <button id="go" type="submit">Unlock</button>
    <div class="msg" id="msg"></div>
  </form>
<script>
  'use strict';
  var f = document.getElementById('f');
  var pw = document.getElementById('pw');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');
  f.onsubmit = async function (e) {
    e.preventDefault();
    var val = pw.value;
    if (!val) return;
    go.disabled = true; msg.textContent = '';
    try {
      var body = new URLSearchParams(); body.append('password', val);
      var r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
      if (r.ok) {
        // Also keep the key for the app's API calls / cross-TV dashboard control.
        try { sessionStorage.setItem('ak', val); } catch (_) {}
        location.reload();
      } else {
        var m = 'Wrong password.';
        try { var j = await r.json(); if (j && j.message) m = j.message; } catch (_) {}
        msg.textContent = m;
        go.disabled = false; pw.value = ''; pw.focus();
      }
    } catch (err) {
      msg.textContent = 'Could not reach this TV.';
      go.disabled = false;
    }
  };
</script>
</body>
</html>
